<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>iValidate - An E-mail validator</title>
</head>
<body>
      <header>
        <nav>
            <div class="logo">iValidator</div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </nav>
      </header>    
      <main>
        <div class="container">
            <h1>Enter your E-mail to Validate</h1>
            <form id="emailForm">
                <input class="space" placeholder="Enter your e-mail to validate" type="email" id="username" name="username" required>
                <br><br>
                <input class="btn" id="btn" type="submit" value="Submit">
            </form>
        </div>
    <div   class="container">
        <h2>Your Result</h2>
        <div id="resultcont">

        </div>
    </div>
      </main>

<script src="script.js"></script>    
</body>
</html>
